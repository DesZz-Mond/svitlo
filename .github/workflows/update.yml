name: update-data

on:
  schedule:
    # Кожні 5 хвилин, але не на початку години (у GitHub Actions тоді найбільше навантаження).
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Перевірити джерело та оновити графік
        run: node scripts/update.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          if git diff --cached --quiet; then
            echo "Нових змін у графіку немає. Перевірку Telegram виконано."
            exit 0
          fi
          git commit -m "data: update"
          git pull --rebase -q
          git push
